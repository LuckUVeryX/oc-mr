name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch toolchain
        run: npm run patch:toolchain

      - name: Run checks
        run: npm run check

      - name: Smoke test fresh package installation
        run: |
          install_dir=$(mktemp -d)
          archive=$(npm pack --pack-destination "$install_dir" --silent)
          npm install --prefix "$install_dir" --omit=dev --ignore-scripts "$install_dir/$archive"
          cd "$install_dir"
          node --input-type=module <<'JS'
          import { createRequire } from "node:module";
          const require = createRequire(import.meta.resolve("oc-mr"));
          const { Effect } = await import(require.resolve("effect"));
          const { NodeServices } = await import(require.resolve("@effect/platform-node"));
          await Effect.runPromise(Effect.void.pipe(Effect.provide(NodeServices.layer)));
          JS
